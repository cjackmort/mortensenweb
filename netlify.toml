# Netlify build configuration.
#
# This is a monorepo, so `base` points at the app rather than the repository
# root. Netlify installs workspace dependencies from the root lockfile
# regardless, which is what keeps the pinned `next-auth` beta exact.
#
# Deploy target decision: Netlify over Cloudflare Workers. Workers' free tier
# caps CPU at 10 ms per invocation, and PBKDF2 at 600,000 iterations costs
# hundreds of milliseconds — the plan's only Blocking-severity infrastructure
# risk. Netlify's Node runtime has no per-invocation CPU cap, so that risk is
# removed rather than paid around, and it also drops the dependency on the
# pre-1.0 `@opennextjs/cloudflare` adapter.

[build]
  base = "apps/platform"
  command = "npm run build"
  publish = ".next"

# Scheduled functions live alongside the app rather than at the repository root,
# because `base` above already scopes the build to `apps/platform` and a
# functions directory outside it would not be picked up.
[functions]
  directory = "netlify/functions"

[build.environment]
  # Match the engines constraint in the root package.json.
  NODE_VERSION = "20"
  # The portal is small; the default is generous but be explicit.
  NEXT_TELEMETRY_DISABLED = "1"

  # Turbopack's incremental build cache records the values of environment
  # variables it saw, and `publish` is `.next`, so that cache is uploaded with
  # the deploy. Secrets scanning finds real credentials in it and fails the
  # build — correctly, since a token sitting in an uploaded artifact is a
  # genuine exposure even though nothing serves it.
  #
  # Omitting only the cache keeps scanning over everything that actually ships,
  # which is where a leak would matter. Disabling the scan wholesale would
  # trade a real protection for a convenience.
  #
  # `.next/cache` is build-time state, not served content; Netlify's Next.js
  # plugin decides what gets served, and it is never from here.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Send the netlify.app hostname to the real one.
#
# Netlify redirects custom-domain *aliases* to the primary domain automatically,
# but not its own `.netlify.app` subdomain — that stays directly reachable. Two
# hostnames serving one portal is a problem here specifically because AUTH_URL
# names only one of them: a client who bookmarks the wrong address gets sign-in
# redirects to the other, loses the session cookie, and is asked to log in
# twice. Exactly the bug we hit ourselves.
#
# `force = true` is required — without it the redirect loses to the existing
# route and never fires.
[[redirects]]
  from = "https://mortensenweb.netlify.app/*"
  to = "https://portal.mortensenweb.com/:splat"
  status = 301
  force = true

# Security headers are set in next.config.ts so they apply identically in
# development, in `next start`, and here. They are deliberately NOT duplicated
# in this file: two sources for the same header is how they drift.

[context.production]
  command = "npm run build"

# Deploy previews get a non-indexed, throwaway environment. They must never
# point at the production database — set DATABASE_URL per-context in the
# Netlify UI, using a Neon branch for previews.
[context.deploy-preview]
  command = "npm run build"

[context.deploy-preview.environment]
  # Belt and braces: the portal already sets robots noindex in metadata.
  NEXT_PUBLIC_ENVIRONMENT = "preview"
