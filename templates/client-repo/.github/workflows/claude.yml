# =============================================================================
# TEMPLATE — copied into every client repository at scaffold time.
#
# A caller, nothing more. The agent's instructions, model, tool allowlist and
# skills live in the agency repository's reusable workflow, so an improvement
# there reaches this site on its next request without this file changing.
#
# Gated on the `claude` label so a human opening an ordinary issue never starts
# a billed run by accident. One run per issue: the portal creates the issue
# with its labels attached, so `opened` and `labeled` can both fire within a
# second — without the concurrency group that is two runs racing to open two
# pull requests for one request.
# =============================================================================

name: Portal change request

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: portal-request-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Required by claude-code-action, which exchanges a GitHub OIDC token for
  # its own credentials. Without it every run fails on its first step.
  id-token: write

jobs:
  implement:
    if: contains(github.event.issue.labels.*.name, 'claude')
    uses: cjackmort/mortensenweb/.github/workflows/client-change.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
      labels: ${{ join(github.event.issue.labels.*.name, ',') }}
    secrets: inherit
