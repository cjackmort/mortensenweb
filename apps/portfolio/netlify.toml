# Netlify configuration for the public agency site.
#
# This is the SECOND Netlify site fed by this repository. The portal is
# configured by the netlify.toml at the repository root, which pins
# `base = "apps/platform"`. Netlify resolves configuration relative to a site's
# configured base directory, so this file is read only when a site sets its
# base to `apps/portfolio` — which the `mortensenweb-site` project does.
#
# Consequence worth stating plainly: the root netlify.toml does NOT apply here,
# and this file does NOT apply to the portal. Changing a header or a redirect
# in one place changes it for one site only. Two sites, two files, on purpose.

[build]
  # Relative to this file's directory, which is already the base.
  command = "npm run build"
  # Astro's static output.
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # This site is Astro now, but the repository still holds a Next.js app
  # (the portal), and Netlify's zero-config Next.js Runtime auto-attaches on
  # framework detection rather than on this file. On 2026-08-29 a
  # cache-cleared build of this site published apps/platform's server output
  # under this domain. Kept, checked into git, so the Runtime stays off here
  # whatever detection decides.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Deliberately no [[plugins]] block: a directory of HTML needs no adapter.

# Security headers.
#
# Set here rather than in next.config.ts, because a static export drops the
# `headers()` function entirely — Next only applies it when something is
# serving the response, and here nothing is. Netlify's edge adds them instead.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # 'unsafe-inline' on script-src covers the one inline script (pointer
    # effects) and the JSON-LD block; on style-src it covers Astro's inlined
    # stylesheet. cloud.umami.is loads the tracker and receives its beacon;
    # Google Fonts serves the two typefaces. Everything else is 'self'.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cloud.umami.is; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Content-hashed build output can be cached indefinitely; nothing else can.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
